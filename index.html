<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Calculator app</title>
<link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>calc</h1>

    <div class="theme-container">

      <div class="theme-label">
        <p class="theme-label-p">1</p>
        <p class="theme-label-p">2</p>
        <p class="theme-label-p">3
        </p>
      </div>
      
      <div class="theme-control">
        <p class="p-theme">theme</p>

    <div class="theme-switch">
      <button type="button" class="button-theme button-1 opacity"></button>
      <button type="button" class="button-theme button-2 "></button>
      <button type="button" class="button-theme button-3 opacity"></button>
      
    </div>
  </div></div>
  
    </header>

    <section class="calculator-container">

  <!-- --- result --- -->

  <div class="result-container">399,981</div>

  <!-- --- key pad --- -->
  <div class="keypad-container"> 

      <button type="button" class="keypad-button">7</button>
      <button type="button" class="keypad-button">8</button>
      <button type="button" class="keypad-button">9</button>
      <button type="button" class="del-btn">DEL</button>



      <button type="button" class="keypad-button">4</button>
      <button type="button" class="keypad-button">5</button>
      <button type="button" class="keypad-button">6</button>
      <button type="button" class="keypad-button keypad-button-operator">+</button>


      <button type="button" class="keypad-button">1</button>
      <button type="button" class="keypad-button">2</button>
      <button type="button" class="keypad-button">3</button>
      <button type="button" class="keypad-button keypad-button-operator">-</button>



      <button type="button" class="keypad-button">.</button>
      <button type="button" class="keypad-button">0</button>
      <button type="button" class="keypad-button keypad-button-operator">/</button>
      <button type="button" class="keypad-button keypad-button-operator">x</button>



  <button type="button" class="reset-button">RESET</button>
  <button type="button" class="reset-button equal-button">=</button>


</section>
</main>

  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by KA.
  </footer>

  <script src="main.js"></script>
</body>
</html>
